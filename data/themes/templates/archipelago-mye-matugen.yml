# archipelago-mye Matugen Template
# by @aidanii

# MATUGEN CONFIG
# For information about using Matugen in general, visit their docs:
# https://iniox.github.io/#matugen

# Place these lines (uncommented) inside your Matugen's config.toml
# [templates.archipelagomye]
# input_path = "path/to/archipelago-mye-matugen.yml"
# output_path = "path/to/Archipelago/data/themes/theme.yml"

# The input path must point to the path of this yaml file
# The output path must point to the data/themes folder inside your
# Archipelago directory, with theme.json at the end.
# This will tell matugen to place the generated theme file there named as "theme.yml"


# [ General Material Options ]
# Base Options for Material Design. Mainly for use with the Wallpaper Options,
# or as a fallback option when a Dynamic Color Option is set to an invalid value

## Set to either "Light" or "Dark"
mode: {{mode}}
## Set to any valid Material You Scheme Names:
## "TONAL_SPOT", "SPRITZ", "VIBRANT", "EXPRESSIVE", "FRUIT_SALAD", "RAINBOW",
## "MONOCHROME", "FIDELITY" and "CONTENT"
scheme: "VIBRANT"


# [ Wallpaper Options ]
# These options will generate a color scheme from a provided wallpaper

## Set to either true or false
use_wallpaper: false

## Set to a valid wallpaper path
path_to_wallpaper: ""


# [ Base16 Color Options ]
# These options only affect the coloring of important words in Text Clients
# and Hint Logs. They replace the TextColors seen in data/client.kv.

<* for name, value in base16 *>
"{{name}}": "{{value.default.hex}}"
<* endfor *>


# [ Dynamic Color Options ]
# These options will directly set the colors for each corresponding part
# of the Archipelago Launcher and any compatible clients from it.
# When `use_wallpaper` is enabled, any options here are ignored.
# Otherwise, options here will ignore the General Material Options

<* for name, value in colors *>
{{name}}_color: "{{value.default.hex}}"
<* endfor *>
